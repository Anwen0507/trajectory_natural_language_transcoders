# Quick multi-checkpoint end-to-end verification — 10 docs, tiny model, single GPU.
# One forward captures embedding + every four-block boundary. Stage 3 writes
# joint AV/RL files at the root and one AR file under checkpoints/{name}/.

model: qwen05b
checkpoint_depths: [0, 4, 8, 12, 16, 20, 24]
output_dir: /tmp/nla_quick_test

corpus:
  name: HuggingFaceFW/fineweb
  config: sample-10BT
  split: train
  text_column: text
  start: 0
  length: 10

stage0:
  positions_per_doc: 3
  chunk_size: 10
  seed: 42
  multigpu: false
  extractor_kwargs: {batch_size: 4, max_length: 1024}

stage1:
  av_sft_frac: 0.25
  ar_sft_frac: 0.25
  rl_frac: 0.50
  seed: 42

stage2:
  provider_cls: nla.datagen.providers.AnthropicProvider
  provider_kwargs:
    model: claude-haiku-4-5-20251001
    max_tokens: 300
    concurrency: 8
  chunk_size: 64

stage3:
  keep_debug_metadata: true

shuffle:
  enabled: true
  seed: 42

storage_cls: nla.datagen.storage.LocalStorage
